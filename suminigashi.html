      <span>N</span><span class="brand-orbit">O</span><span>M</span>
    </a>
    <nav class="primary-nav" id="primary-nav" aria-label="Основная навигация">
      <ul id="nav-list"></ul>
    </nav>
    <div class="header-actions">
      <div class="language-switch" role="group" aria-label="Language / Язык">

        <a href="suminigashi.html?lang=en" data-language="en" hreflang="en">EN</a>

      </div>
      <nav class="social social--header" aria-label="Соцсети в шапке">

      </button>
    </div>
  </header>

  <main class="ink-stage" id="stage">
    <h1 class="ink-visually-hidden">Suminigashi</h1>

    <canvas id="water" data-tool="brush" role="img"
            aria-label="Поверхность воды с плавающими чернилами. Проведите курсором или пальцем, чтобы рисовать."></canvas>

    <p class="ink-hint" id="hint" data-i18n="hint">Проведите по воде</p>

    <div class="ink-dock" id="ink-dock">
      <button class="ink-collapse" id="collapse" type="button"
              aria-expanded="true" aria-controls="ink-dock-body" data-i18n-aria="collapse"
              aria-label="Свернуть панель"></button>

      <div class="ink-dock-body" id="ink-dock-body">

        <div class="ink-row ink-row--tools">
          <div class="ink-tools" role="group" data-i18n-aria="tools" aria-label="Инструмент">
            <button class="ink-tool is-active" type="button" data-tool="brush" aria-pressed="true" data-i18n="brush">Кисть</button>
            <button class="ink-tool" type="button" data-tool="ring" aria-pressed="false" data-i18n="rings">Кольцо</button>
            <button class="ink-tool" type="button" data-tool="comb" aria-pressed="false" data-i18n="comb">Гребень</button>
          </div>
        </div>

        <div class="ink-row ink-row--inks" role="group" data-i18n-aria="inks" aria-label="Чернила">
          <button class="ink-swatch is-active" type="button" id="ink-cycle" aria-pressed="true"
                  data-i18n-aria="cycle" aria-label="Перебор цветов"></button>
          <button class="ink-swatch" type="button" data-ink="0" aria-pressed="false" aria-label="Чернила 1"></button>
          <button class="ink-swatch" type="button" data-ink="1" aria-pressed="false" aria-label="Чернила 2"></button>
          <button class="ink-swatch" type="button" data-ink="2" aria-pressed="false" aria-label="Чернила 3"></button>
          <button class="ink-swatch" type="button" data-ink="3" aria-pressed="false" aria-label="Чернила 4"></button>
          <button class="ink-palette" type="button" id="palette" title="Сменить палитру">Traditional</button>
        </div>

        <div class="ink-row ink-row--sliders">
          <label class="ink-slider">
            <span data-i18n="flow">Плотность</span>
            <input type="range" id="flow" min="0" max="0.4" step="0.01" value="0.14">
          </label>
          <label class="ink-slider">
            <span data-i18n="curl">Закрутка</span>
            <input type="range" id="curl" min="0" max="40" step="1" value="14">
          </label>
          <label class="ink-slider">
            <span data-i18n="fade">Растворение</span>
            <input type="range" id="fade" min="0" max="0.5" step="0.01" value="0.07">
          </label>
          <label class="ink-slider">
            <span data-i18n="force">Сила</span>
            <input type="range" id="force" min="0" max="11000" step="100" value="4800">
          </label>
        </div>

        <div class="ink-row ink-actions">
          <button class="ink-act" type="button" id="auto" aria-pressed="false" data-i18n="auto">Поток</button>
          <button class="ink-act" type="button" id="wash" data-i18n="wash">Смыть</button>
          <button class="ink-act" type="button" id="undo" disabled data-i18n="undo">Отменить</button>
          <button class="ink-act ink-act--primary" type="button" id="save" data-i18n="save">Сохранить</button>
        </div>

      </div>
    </div>

    <div class="ink-fallback" id="ink-fallback" hidden>
      <h2 id="ink-fallback-title">Вода не налилась</h2>
      <p id="ink-fallback-text">Этой странице нужен WebGL 2 и видеокарта, которая умеет считать в половинной точности.</p>
    </div>
  </main>
</body>
</html>
