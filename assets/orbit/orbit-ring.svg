<text x="616" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-style="italic" fill="#5f7079">по позвоночнику</text>
<text x="410" y="266" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5f7079" text-anchor="middle">один круг</text>
