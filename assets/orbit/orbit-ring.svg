<text x="410" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#12303f" text-anchor="middle">макушка — начало и конец круга</text>
<text x="410" y="470" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#12303f" text-anchor="middle">нижняя точка таза — разворот</text>
<text x="204" y="244" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#12303f" text-anchor="end">вниз</text>
